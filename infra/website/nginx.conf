# ===================================================================
# nginx.conf — TrackFlow Website
# Servidor optimizado para contenido estático HTML + Tailwind CDN
# ===================================================================

server {
    listen      80;
    server_name trackflow.local;

    root /usr/share/nginx/html;
    absolute_redirect off;

    # Gzip compresión para rendimiento
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Página principal
    index index.html;

    # Redirección /application -> application.html
    location = /application {
        return 301 /application.html;
    }

    # Archivos estáticos con caché (1 día)
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Error 404 personalizado
    error_page 404 /404.html;

    location = /404.html {
        internal;
        default_type text/html;
        return 404 '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>404 — Página no encontrada</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f3f4f6;color:#1f2937;text-align:center;padding:1rem}h1{font-size:3rem;margin:0 0 0.5rem}p{font-size:1.125rem;color:#6b7280}a{color:#4f46e5}</style></head><body><div><h1>404</h1><p>Esta página no existe en TrackFlow.</p><a href="/">Volver al inicio</a></div></body></html>';
    }
}